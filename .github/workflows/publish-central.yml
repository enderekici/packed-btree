name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Immutable release version (0.x.y or 0.x.y-rcN)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: central-publish-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release request and credentials
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^0\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "::error::Release version must match 0.x.y or 0.x.y-rcN and must not be a SNAPSHOT."
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_VERSION}")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::The release tag already exists; Central releases are immutable."
            exit 1
          fi
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD GPG_SIGNING_KEY GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository secret $name is required."
              exit 1
            fi
          done

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Import dedicated publishing key
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "sec" { count++ } END { exit count == 1 ? 0 : 1 }'

      - name: Set release version in this workflow checkout
        shell: bash
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.codehaus.mojo:versions-maven-plugin:2.22.0:set
          -DnewVersion="$RELEASE_VERSION"
          -DprocessAllModules=true
          -DgenerateBackupPoms=false

      - name: Verify signed core release
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-transfer-progress -Pcentral-release -pl library -am clean verify

      - name: Upload core release bundle for Central validation
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-transfer-progress -Pcentral-release -pl library -am -DskipTests deploy
