name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - java: '17'
            profile: ''
          - java: '25'
            profile: '-Psimd'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress ${{ matrix.profile }} clean verify
      - name: Verify runnable benchmark JAR
        run: java -jar benchmarks/target/benchmarks.jar -l
